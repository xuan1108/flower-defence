<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FLOWER DEFENCE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pixel-font:'Silkscreen','Press Start 2P','Tiny5','Pixelify Sans','Minecraftia','Zpix','VT323','Courier New',monospace;
  --cell-size:62px;
  --gap:2px;
  --pixel-purple:#c084fc;
  --pixel-shadow:#5a3f7c;
}
body{
  background:#0f0f23;color:#fff;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:13px;
  display:flex;justify-content:center;align-items:center;min-height:100dvh;overflow:hidden;
}
button{font-family:var(--pixel-font);text-transform:uppercase}
#app{width:min(410px,100vw - 24px);padding:10px 12px;display:flex;flex-direction:column;gap:3px;max-height:100dvh;overflow:hidden;box-sizing:border-box;}

/* Built-in 5x7 pixel lettering */
.px{display:inline-flex;align-items:flex-start;gap:calc(var(--px-unit,2px)*1.4);line-height:1}
.px-word{display:inline-flex;gap:var(--px-unit,3px)}
.px-space{width:calc(var(--px-unit,3px)*3);height:calc(var(--px-unit,3px)*7)}
.px-glyph{display:grid;grid-template-columns:repeat(5,var(--px-unit,3px));grid-template-rows:repeat(7,var(--px-unit,3px))}
.px-dot{width:var(--px-unit,3px);height:var(--px-unit,3px)}
.px-on{background:var(--px-color,#c084fc);box-shadow:var(--px-shadow,1px 0 0 #5a3f7c,0 1px 0 #5a3f7c)}
.px-title{--px-unit:3px;--px-color:#f3e8ff;--px-shadow:0 0 6px rgba(192,132,252,.75),1px 0 0 #c084fc,0 1px 0 #c084fc,2px 0 0 #5a3f7c,0 2px 0 #5a3f7c;justify-content:center;flex-wrap:wrap}
.px-ui{--px-unit:1.8px;--px-color:#aaa6cc;--px-shadow:1px 0 0 #4a3a66,0 1px 0 #4a3a66}
.px-purple{--px-color:#c084fc;--px-shadow:1px 0 0 #5a3f7c,0 1px 0 #5a3f7c}
.px-button{--px-unit:2px;--px-color:#c084fc;--px-shadow:1px 0 0 #5a3f7c,0 1px 0 #5a3f7c}
.px-score{--px-unit:3px;--px-color:#ffcc00;--px-shadow:1px 0 0 #886600,0 1px 0 #886600}
.px-level{--px-unit:1.5px;--px-color:#c084fc;--px-shadow:1px 0 0 #5a3f7c,0 1px 0 #5a3f7c}
.px-section{--px-unit:1.2px;--px-color:#777186;--px-shadow:1px 0 0 #2a2340,0 1px 0 #2a2340}
.px-pause-title{--px-unit:2.5px;--px-color:#c084fc;--px-shadow:1px 0 0 #5a3f7c,0 1px 0 #5a3f7c}
.px-pause-button{--px-unit:1.75px;--px-color:#c084fc;--px-shadow:1px 0 0 #5a3f7c,0 1px 0 #5a3f7c}
.px-game-title{--px-unit:2.5px;--px-color:#ff4444;--px-shadow:1px 0 0 #5a1f35,0 1px 0 #5a1f35}
.px-game-score{--px-unit:2.5px;--px-color:#ffcc00;--px-shadow:1px 0 0 #886600,0 1px 0 #886600}
.px-game-sub{--px-unit:2px;--px-color:#c084fc;--px-shadow:1px 0 0 #5a3f7c,0 1px 0 #5a3f7c}

/* Top bar */
#topbar{display:flex;justify-content:space-between;align-items:flex-end;padding:0 0 5px;border-bottom:2px solid #3a3a5c;width:calc(var(--cell-size)*5 + var(--gap)*4);margin:0 auto;}
.top-l{display:flex;flex-direction:column;gap:0px;}
.sc-row{display:flex;align-items:flex-end;gap:4px;}
.sc-l,.bdg{width:60px;}
.sc-l{min-height:11px;}
.sc-v{min-height:21px;}
.bdg{
  background:#2a2a44;border:2px solid #5a4a7a;padding:2px 0;
  border-radius:2px;min-height:20px;display:flex;align-items:center;justify-content:center;
}
#pauseBtn{align-self:flex-end;margin-bottom:-2px;}
/* Toolbox row */
.tbrow{
  display:flex;align-items:flex-start;justify-content:flex-start;
  width:calc(var(--cell-size)*5 + var(--gap)*4);
  margin:0 auto;gap:var(--gap);position:relative;
  padding-top:2px;
}
#toolbox{
  display:flex;align-items:flex-start;justify-content:center;
  gap:var(--gap);padding:6px 0;
  position:relative;
  margin-left:calc((var(--cell-size) + var(--gap))*2);
}
#toolbox .tbwrap{
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
#toolbox .tbs{
  margin-left:0;
}
#toolbox .tbl{
  display:flex;align-items:center;justify-content:center;
  font-size:8px;color:#777186;letter-spacing:2px;
}
#pauseBtn{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:rgba(20,20,40,.88);border:1.5px solid #5a4a7a;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 1px 6px rgba(0,0,0,.5);
  position:relative;
}
#pauseBtn:hover{background:#2a1a4a;border-color:#a78bfa;transform:scale(1.08)}
#pauseBtn:active{background:#3a1a5a;transform:scale(.94)}
#pauseBtn .pbars{
  display:flex;align-items:center;justify-content:center;gap:3px;
  width:100%;height:100%;
}
#pauseBtn .pbars::before,
#pauseBtn .pbars::after{
  content:'';
  display:block;
  width:2px;height:8px;background:#a78bfa;border-radius:0.5px;
  flex-shrink:0;
}

/* Section labels */
.sl{
  display:flex;justify-content:center;margin:4px 0;min-height:11px;
}

/* Board container — smooth opacity transition to reduce flash */
#boardbrd{transition:opacity .08s;contain:layout}

/* Board grid — 让棋盘格居中，左侧小字绝对定位避免被遮挡 */
.brd{display:flex;flex-direction:column;gap:var(--gap);align-items:center;position:relative;}
.brd-r{display:flex;align-items:center;justify-content:center;gap:var(--gap);width:calc(var(--cell-size)*5 + var(--gap)*4);position:relative;}
.ri{position:absolute;left:-20px;width:18px;text-align:center;font-size:8px;color:#4a4a66;}
.ri.d{color:#ff4444}

.cell{
  width:var(--cell-size);height:var(--cell-size);aspect-ratio:1/1;background:#16162a;border:2px solid #2a2a44;
  display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;user-select:none;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.cell.def{background:#1a1a30;border-color:#3a2a5a;cursor:grab;}
.cell.def:active{cursor:grabbing}
.cell.hm{border-color:#3a2a3a;}
.cell.drag-over{border-color:#ffcc00!important;box-shadow:inset 0 0 0 2px #ffcc00;background:#2a1a44;}
.cell.drag-move{border-color:#44cc88!important;box-shadow:inset 0 0 0 2px #44cc88;background:#1a2a2a;}

.sep{height:4px;background:#2a2a44;margin:2px auto;width:calc(var(--cell-size)*5 + var(--gap)*4);transition:background .2s,box-shadow .2s;box-shadow:0 0 0 rgba(255,50,50,0);}
.sep.danger{animation:sepFlash .5s infinite alternate;}
@keyframes sepFlash{
  from{background:#2a2a44;box-shadow:0 0 6px rgba(255,50,50,0);}
  to{background:#cc3333;box-shadow:0 0 14px rgba(255,50,50,.8);}
}

.fm{font-size:28px;line-height:1;pointer-events:none;transition:transform .15s}
.fv{
  font-size:14px;font-weight:700;color:#ccccee;position:absolute;bottom:2px;right:5px;
  text-shadow:0 0 3px rgba(0,0,0,.8);
}

/* Monster overlay */
.mo{
  position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(34,26,42,.88);border:2px solid #5a3a3a;z-index:10;
  transition:border-color .15s;
}
.mm{font-size:28px;line-height:1;}
.ht{
  position:absolute;top:1px;right:3px;font-size:12px;font-weight:700;color:#ff4444;
  text-shadow:0 0 3px rgba(0,0,0,.8);
}
.hb{position:absolute;bottom:3px;left:5px;right:5px;height:4px;background:#2a2a2a;border:1px solid #3a3a3a;}
.hf2{height:100%;background:#ff4444;transition:width .2s;}
.dr{position:absolute;bottom:-13px;font-size:9px;color:#a855f7;white-space:nowrap;font-weight:700;}

/* ───────────────────────────── */
/* 攻击弹道动画 — 🍃 飞向怪兽    */
#proj{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:500}
.leaf{
  position:fixed;font-size:28px;pointer-events:none;z-index:510;
  transition:all .5s cubic-bezier(.2,.8,.3,1);
  filter:drop-shadow(0 0 6px rgba(100,255,100,.9));
}
.dmg-pop{
  position:fixed;font-size:14px;font-weight:700;color:#ff4444;pointer-events:none;z-index:520;
  animation:dmgFly .7s ease-out forwards;
  text-shadow:0 0 4px rgba(255,0,0,.6);
}
@keyframes dmgFly{
  0%{opacity:1;transform:translateY(0) scale(1)}
  60%{opacity:.8;transform:translateY(-16px) scale(1.15)}
  100%{opacity:0;transform:translateY(-28px) scale(.8)}
}

/* Toolbox 选中高亮 */
#tbslot.sel{border-color:#ffcc00!important;box-shadow:0 0 8px rgba(255,204,0,.5);animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 4px rgba(255,204,0,.3)}to{box-shadow:0 0 12px rgba(255,204,0,.7)}}
.cell.tb-target{border-color:#a855f7!important;box-shadow:inset 0 0 0 2px #a855f7;background:#1a1a3a;}

/* ───────────────────────────── */
/* 像素消散 — 慢速破碎+上飘，肉眼绝不可能错过 */
.mo.dying{
  animation:pixDie .85s ease-in forwards;
}
@keyframes pixDie{
  0%{opacity:1;transform:scale(1);filter:none}
  8%{filter:brightness(4) contrast(4) saturate(0) hue-rotate(-20deg);transform:scale(1.2)}
  20%{opacity:.9;filter:brightness(2.5) contrast(2) blur(0px);transform:scale(1.05) rotate(2deg)}
  35%{opacity:.65;filter:brightness(1.8) blur(1px) saturate(0.5);transform:scale(.8) rotate(-3deg)}
  55%{opacity:.35;filter:blur(3px) saturate(0) brightness(1.2);transform:scale(.4) rotate(6deg) translateY(-4px)}
  75%{opacity:.1;filter:blur(5px) brightness(.3);transform:scale(.15) rotate(-10deg) translateY(-10px)}
  100%{opacity:0;transform:scale(0) rotate(20deg) translateY(-20px);filter:blur(6px) brightness(0)}
}

/* Toolbox */
#toolbox{border:none;}
.tbs{
  width:48px;height:48px;aspect-ratio:1/1;border:2px dashed #4a3a5a;background:#12122a;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  position:relative;flex-shrink:0;cursor:pointer;transition:border-color .2s,background .2s;
}
.tbs.h{border-color:#a855f7;border-style:solid;background:#1e1a3a;}
.tbs .fm{font-size:22px}
.tbs .fv{position:absolute;bottom:1px;font-size:10px;color:#a855f7}
.tbh{font-size:8px;color:#555;max-width:90px;line-height:1.3}

/* Drag ghost */
#ghost{
  position:fixed;pointer-events:none;z-index:999;
  display:none;align-items:center;justify-content:center;flex-direction:column;
  width:56px;height:56px;aspect-ratio:1/1;background:rgba(26,26,48,.9);border:2px solid #a855f7;
  opacity:.85;
}
#ghost .fm{font-size:28px}
#ghost .fv{font-size:14px;font-weight:700;color:#ccccee;position:absolute;bottom:2px;right:5px}

/* Game Over */
#gover{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100}
#gover.show{opacity:1;pointer-events:auto}
.gb{background:#1a1a2e;border:3px solid #ff4444;padding:34px 38px 32px;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:360px}
.gt,.gs,.gw{display:flex;justify-content:center}
.gt{min-height:18px;margin-bottom:4px}
.gs{min-height:18px}
.gw{min-height:14px;margin-bottom:8px;display:flex;gap:22px;justify-content:center}
#rst,#btnhome{
  background:#2a2a44;border:2px solid #a855f7;color:#c084fc;font-family:var(--pixel-font);
  padding:0;border-radius:2px;cursor:pointer;width:226px;height:44px;display:flex;
  align-items:center;justify-content:center;transition:all .2s;
}
#rst:hover,#btnhome:hover{background:#3a3a5c;border-color:#c084fc;color:#e9d5ff}
#rst:active,#btnhome:active{background:#3a3a5c;transform:scale(.98)}

/* Swap highlight */
.cell.drag-swap{border-color:#4488ff!important;box-shadow:inset 0 0 0 2px #4488ff;background:#1a2a3a;}

/* Toast */
#toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);border:2px solid #a855f7;padding:10px 20px;font-size:16px;font-weight:700;color:#c084fc;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:200}
#toast.show{opacity:1}

/* LEVEL UP animation */
#lvup{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:var(--pixel-font);font-size:24px;font-weight:800;color:#ffffff;
  text-shadow:0 0 16px rgba(255,255,255,.7),0 0 32px rgba(200,200,255,.4);
  opacity:0;pointer-events:none;z-index:250;letter-spacing:3px;
  text-align:center;
  transition:none;
}
#lvup.show{animation:lvUpFly 1s ease-out forwards}
@keyframes lvUpFly{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  60%{opacity:.8;transform:translate(-50%,-65%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-80%) scale(.8)}
}

/* Leaderboard drawer */
#lboverlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;z-index:1100;transition:opacity .25s;
}
#lboverlay.show{opacity:1;pointer-events:auto}
#lbdrawer{
  position:fixed;top:0;right:0;bottom:0;width:280px;background:#0f0f23;
  border-left:2px solid #3a3a5c;z-index:1110;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding:20px 16px;overflow-y:auto;
}
#lboverlay.show #lbdrawer{transform:translateX(0)}
.lb-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lb-hd-title{display:flex;min-height:14px}
#lbclose{background:none;border:1px solid #3a3a5c;color:#8888aa;width:30px;height:30px;border-radius:50%;cursor:pointer;font-family:var(--pixel-font);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
#lbclose:hover{color:#ffcc00;border-color:#ffcc00}
.lb-table{width:100%;border-collapse:collapse;font-size:11px}
.lb-table th{color:#7777aa;font-weight:400;border-bottom:1px solid #2a2a44;padding:5px 4px;text-align:left;font-size:10px}
.lb-table td{color:#aaaacc;padding:5px 4px;border-bottom:1px solid #1a1a30}
.lb-table tr:nth-child(even) td{color:#9999bb}
.lb-empty{font-size:11px;color:#555;text-align:center;padding:16px 0}
.menu-btn,.ss-lb-btn,#btnstart{
  width:156px;height:40px;background:#2a2142;border:2px solid #6b4f91;color:var(--pixel-purple);
  border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;margin-top:4px;transition:transform .2s,box-shadow .2s,filter .2s,background .2s;
}
.menu-btn:hover,.ss-lb-btn:hover,#btnstart:hover{transform:scale(1.04) translateY(-1px);box-shadow:0 0 16px rgba(168,85,247,.45);filter:brightness(1.12);background:#30254a}
.menu-btn:active,.ss-lb-btn:active,#btnstart:active{transform:scale(.97)}

/* ──────────── Start Screen ──────────── */
#startscreen{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a18;display:flex;align-items:center;justify-content:center;z-index:1000;transition:opacity .4s,transform .4s;}
#startscreen.hide{opacity:0;pointer-events:none;transform:scale(1.05)}
.ss-box{width:410px;background:linear-gradient(180deg,#12122a,#0f0f23);border:2px solid #3a3a5c;padding:30px 22px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 0 40px rgba(168,85,247,.15);}
.ss-title{
  font-family:var(--pixel-font);font-size:30px;font-weight:700;letter-spacing:2px;
  line-height:1.25;text-align:center;text-transform:uppercase;
  background:linear-gradient(90deg,#c084fc,#f3e8ff,#a855f7,#c084fc);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 10px rgba(192,132,252,.55)) drop-shadow(3px 0 0 var(--pixel-shadow)) drop-shadow(0 3px 0 var(--pixel-shadow));
  animation:titlePulse 2.2s ease-in-out infinite alternate,titleGradient 4s linear infinite;
}
@keyframes titlePulse{
  from{filter:drop-shadow(0 0 8px rgba(192,132,252,.45)) drop-shadow(3px 0 0 var(--pixel-shadow)) drop-shadow(0 3px 0 var(--pixel-shadow));}
  to{filter:drop-shadow(0 0 18px rgba(192,132,252,.85)) drop-shadow(3px 0 0 var(--pixel-shadow)) drop-shadow(0 3px 0 var(--pixel-shadow));}
}
@keyframes titleGradient{
  0%{background-position:0% 50%}
  100%{background-position:100% 50%}
}
.ss-icons{font-size:24px;letter-spacing:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.ss-div{width:80px;height:1px;background:#3a3a5c}
.ss-rules{width:fit-content;margin:0 auto;font-size:11px;color:#8888aa;line-height:1.8;padding:0;display:flex;flex-direction:column;gap:2px}
.ss-rule-line{display:grid;grid-template-columns:68px 1fr;gap:4px;align-items:baseline}
.ss-rule-line b{color:#c084fc;white-space:nowrap;text-align:justify;text-align-last:justify}
.ss-rule-line b::after{content:'';display:inline-block;width:100%}
.ss-rule-line span{color:#8888aa;grid-column:2}
.ss-rule-line.sub{padding-left:0}
#btnstart{
  margin-top:4px;
}

/* Start screen demo */
.ss-demo{width:100%;margin:8px 0 6px}
.demo-title{font-family:var(--pixel-font);font-size:10px;color:#7777aa;text-align:center;letter-spacing:2px;margin-bottom:6px}
.demo-stage{width:260px;height:116px;position:relative;margin:0 auto;background:#12122a;border:1px solid #2a2a44;border-radius:4px;overflow:hidden}
.demo-row{display:flex;justify-content:flex-start;gap:4px;align-items:center;position:absolute;left:12px;right:12px;height:42px}
.demo-row.monster{top:10px}
.demo-row.defense{bottom:10px}
.demo-cell{width:42px;height:42px;aspect-ratio:1/1;background:#16162a;border:2px solid #2a2a44;border-radius:3px}
.demo-toolbox{position:absolute;left:12px;bottom:10px;width:42px;height:42px;aspect-ratio:1/1;border:2px dashed #4a3a5a;background:#12122a;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#c084fc}
.demo-entity{position:absolute;transition:all .5s cubic-bezier(.2,.8,.3,1);pointer-events:none;font-size:24px;z-index:10;width:42px;height:42px;line-height:1;display:flex;align-items:center;justify-content:center}
.demo-leaf{filter:drop-shadow(0 0 4px rgba(100,255,100,.9));font-size:24px;transition:all .45s cubic-bezier(.2,.8,.3,1)}
.demo-monster{filter:drop-shadow(0 0 4px rgba(255,100,100,.4))}
.demo-pulse{animation:mergePulse .45s ease}
@keyframes mergePulse{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.demo-fade{animation:demoFade .35s ease forwards}
@keyframes demoFade{to{opacity:0;transform:scale(1.15)}}
.demo-pop{animation:demoPop .4s ease forwards}
@keyframes demoPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
.demo-cursor{position:absolute;width:20px;height:20px;z-index:50;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.3,1);opacity:0;transform:translate(-2px,-2px);}
.demo-cursor svg{width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}

/* Pause overlay */
#pauseover{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
#pauseover.show{opacity:1;pointer-events:auto}
.pbox{position:relative;background:#1a1a2e;border:2px solid #7c3aed;padding:36px 44px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:260px}
.ptitle{display:flex;justify-content:center;min-height:21px;margin-bottom:4px}
.pclose{position:absolute;top:8px;right:10px;background:none;border:none;color:#8888aa;font-family:var(--pixel-font);font-size:17px;cursor:pointer;padding:2px 6px;line-height:1;transition:color .15s}
.pclose:hover{color:#ffcc00}

.prst:hover,.pcontinue:hover{background:#3a3a5c;border-color:#c084fc;color:#e9d5ff}

<script>
// ============================================================
const P_ROWS=5, D_ROWS=3, COLS=5, TOTAL_ROWS=P_ROWS+D_ROWS;
const FMAP={1:'🌷',2:'🌹',4:'🌺',8:'🌸',16:'🌼',32:'🌻',64:'💐',128:'🌿',256:'🪴',512:'🌱',1024:'🍀',2048:'🌲',4096:'🎄',8192:'🍁'};
const MTPS=['👾','👻','🦖'];
const rand=(a,b)=>~~(Math.random()*(b-a+1))+a;
const pick=a=>a[~~(Math.random()*a.length)];
const fe=v=>FMAP[v]||'🍁';
// HP曲线：与花列总伤害匹配，保持1~2击可杀的基本张力
// LV1~4: kill驱动学习期  LV5+: level驱动，与花力成长同步
// 目标：LV5花力10~20 → 怪HP12~18  LV7花力15~25 → 怪HP22~32  LV10花力20~40 → 怪HP45~65
const mhpLv=(l,kill)=>{
  if(kill<=3)return 1;                        // 教程：摸一下就死
  if(kill<=10)return 2;                       // ★ 关键区间：1级花需2击，2级花1击
  if(kill<=16)return 2+rand(0,1);             // 2~3血，1级花打不动了，必须用2级花
  if(kill<=24)return 3+rand(0,3);             // 逐渐加厚
  if(kill<=35)return 5+rand(0,7);
  // ★ 平滑HP曲线：LV7=17~27  LV8=24~40  LV9=27~45  LV10=40~65  LV15=82~127
  if(l<=7)return Math.floor(l*2.5)+rand(0,Math.floor(l*1.5));    // LV5:12~19  LV7:17~27
  if(l<=9)return Math.floor(l*3.0)+rand(0,Math.floor(l*2.0));    // LV8:24~40  LV9:27~45 (平滑过渡)
  if(l<=12)return Math.floor(l*4.0)+rand(0,Math.floor(l*2.5));   // LV10:40~65  LV12:48~78
  if(l<=16)return Math.floor(l*5.0)+rand(0,Math.floor(l*2.5));    // LV14:70~105  LV16:80~120 (14-16关降密度)
  if(l<=20)return Math.floor(l*5.5)+rand(0,Math.floor(l*3));      // LV17:93~144  LV20:110~170
  return Math.floor(l*7)+rand(0,Math.floor(l*4));                // 超后期略微加速
};
// 掉落花：最高16级且极其罕见，1级花贯穿全程——取舍是策略核心
// kill 用于早期波形控制，l 用于中后期关卡推进
const mdropLv=(l,kill)=>{
  // 前3~4波：只有1级花，2级花最早第4波后出现
  if(kill<=3)return 1;
  if(kill<=8)return pick([1,1,1,2]);              // 25%出2级
  if(kill<=16)return pick([1,1,2,2]);             // 50%出2级
  if(kill<=30)return pick([1,1,2,2,2,4]);         // 17%4级
  // 中后期：高等级渐出，16级仅在高等级极其罕见出现
  if(l<=5)return pick([1,1,2,2,2,4,4]);           // 29%1级,43%2级,29%4级
  if(l<=10)return pick([1,1,2,2,4,4,8]);          // 29%1级,29%2级,29%4级,14%8级
  if(l<=15)return pick([1,1,2,4,4,8,8]);          // 29%1级,14%2级,29%4级,29%8级
  if(l<=25)return pick([1,1,2,2,4,4,8,8]);        // 无16
  if(l<=40)return pick([1,1,1,2,2,4,4,8,8,8,16]); // ~9%16级 (极其罕见)
  return pick([1,1,1,2,2,4,4,8,8,8,16]);           // ~8%16级 (极其罕见)
};
// ★ 掉落率逐步递减：前期高（教学友好），中后期保持40%底线避免拿不到花
function cmLv(lv,c,row,kill){
  const h=mhpLv(lv,kill), dv=mdropLv(lv,kill);
  const dropRate=kill<=3?0.9:kill<=8?0.75:kill<=20?0.6:kill<=35?0.5:kill<=60?0.48:lv>=16?0.45:0.38;
  const hasDrop=Math.random()<dropRate;
  return{id:Date.now()+Math.random(),e:pick(MTPS),hp:h,mh:h,col:c,row:row||0,dv:hasDrop?dv:0,de:hasDrop?fe(dv):''};
}

// ============================================================
let G={
  flowers:[],monsters:[],toolbox:null,score:0,level:1,go:false,
  dying:[],tbSel:false,paused:false,
  spawnCount:0, turnSinceSpawn:0, killCount:0, prevLevel:1
};
let drag=null;

// LEVEL UP animation
function showLvUp(){
  const el=$('lvup');
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function init(){
  G.flowers=[];G.monsters=[];G.toolbox=null;G.score=0;G.level=1;G.go=false;
  G.dying=[];G.tbSel=false;
  G.spawnCount=0; G.turnSinceSpawn=0; G.killCount=0; G.prevLevel=1;
  // 初始花田只有一朵1级花，位置随机
  G.flowers.push({r:rand(P_ROWS,P_ROWS+1),c:rand(0,COLS-1),v:1});
  spawnMonsters(); renderAll();
}
// ★ 击杀数驱动难度：前3~4击杀简单，之后逐渐加压
function spawnMonsters(){
  G.spawnCount++;
  G.level=Math.min(999,Math.floor((G.spawnCount-1)/10)+1);
  const k=G.killCount, l=G.level;
  const total=G.monsters.length;
  const cap=k<=3?5:k<=6?6:k<=10?8:k<=20?10:k<=35?12:k<=60?14:l<=16?15:16;
  if(total>=cap)return;
  // 击杀数决定每批数量：14~16关降低密度
  let cnt=k<=3?1:k<=6?rand(1,2):k<=10?rand(1,3):k<=15?rand(2,3):k<=22?rand(2,4):k<=40?rand(3,4):l<=16?rand(3,4):rand(3,5);
  cnt=Math.min(cnt,cap-total);
  const usedCols=new Set(G.monsters.filter(m=>m.row===0).map(m=>m.col));
  let freeCols=[0,1,2,3,4].filter(c=>!usedCols.has(c));
  if(!freeCols.length) freeCols=[0,1,2,3,4].filter(c=>!usedCols.has(c));
  if(!freeCols.length) freeCols=[0,1,2,3,4]; // fallback
  const cols=shuffle(freeCols).slice(0,cnt);
  // 所有怪兽必须从 monster path 第一行 (row=0) 出现
  for(const c of cols){
    const m=cmLv(G.level,c,0,k);
    if(G.spawnCount===1){
      // 第一只怪兽：1级且无花（教学怪）
      m.hp=1; m.mh=1; m.dv=0; m.de='';
    }else if(G.spawnCount===2){
      // 第二只怪兽：必须带1级花
      m.dv=1; m.de=fe(1);
    }
    G.monsters.push(m);
  }
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=rand(0,i);[b[i],b[j]]=[b[j],b[i]];}return b;}

// ============================================================
// 分部渲染：只改变化的部分，避免全屏闪动
const $=id=>document.getElementById(id);
const PX_FONT={
  A:["01110","10001","10001","11111","10001","10001","10001"],
  B:["11110","10001","10001","11110","10001","10001","11110"],
  C:["01111","10000","10000","10000","10000","10000","01111"],
  D:["11110","10001","10001","10001","10001","10001","11110"],
  E:["11111","10000","10000","11110","10000","10000","11111"],
  F:["11111","10000","10000","11110","10000","10000","10000"],
  G:["01111","10000","10000","10011","10001","10001","01110"],
  H:["10001","10001","10001","11111","10001","10001","10001"],
  I:["11111","00100","00100","00100","00100","00100","11111"],
  K:["10001","10010","10100","11000","10100","10010","10001"],
  L:["10000","10000","10000","10000","10000","10000","11111"],
  M:["10001","11011","10101","10101","10001","10001","10001"],
  N:["10001","11001","10101","10011","10001","10001","10001"],
  O:["01110","10001","10001","10001","10001","10001","01110"],
  P:["11110","10001","10001","11110","10000","10000","10000"],
  R:["11110","10001","10001","11110","10100","10010","10001"],
  S:["01111","10000","10000","01110","00001","00001","11110"],
  T:["11111","00100","00100","00100","00100","00100","00100"],
  U:["10001","10001","10001","10001","10001","10001","01110"],
  V:["10001","10001","10001","10001","10001","01010","00100"],
  W:["10001","10001","10001","10101","10101","10101","01010"],
  X:["10001","01010","00100","00100","00100","01010","10001"],
  Y:["10001","01010","00100","00100","00100","00100","00100"],
  0:["01110","10001","10011","10101","11001","10001","01110"],
  1:["00100","01100","00100","00100","00100","00100","01110"],
  2:["01110","10001","00001","00010","00100","01000","11111"],
  3:["11110","00001","00001","01110","00001","00001","11110"],
  4:["00010","00110","01010","10010","11111","00010","00010"],
  5:["11111","10000","10000","11110","00001","00001","11110"],
  6:["01110","10000","10000","11110","10001","10001","01110"],
  7:["11111","00001","00010","00100","01000","01000","01000"],
  8:["01110","10001","10001","01110","10001","10001","01110"],
  9:["01110","10001","10001","01111","00001","00001","01110"],
  ":":["00000","00100","00100","00000","00100","00100","00000"],
  "|":["00100","00100","00100","00100","00100","00100","00100"],
  " ":["00000","00000","00000","00000","00000","00000","00000"]
};
function pxText(text,cls='px-ui'){
  const safe=String(text).toUpperCase();
  let out=`<span class="px ${cls}" aria-label="${safe.replace(/"/g,'&quot;')}">`;
  for(const ch of safe){
    if(ch===' '){out+='<span class="px-space"></span>';continue;}
    const rows=PX_FONT[ch]||PX_FONT[' '];
    out+='<span class="px-glyph" aria-hidden="true">';
    for(const bit of rows.join(''))out+=`<span class="px-dot${bit==='1'?' px-on':''}"></span>`;
    out+='</span>';
  }
  return out+'</span>';
}
function applyStaticPixelText(){
  document.querySelectorAll('[data-pixel]').forEach(el=>{
    el.innerHTML=pxText(el.dataset.pixel,el.dataset.pixelClass||'px-ui');
  });
}
applyStaticPixelText();

// Leaderboard — localStorage (after $ definition)
const LB_KEY='flower_td_lb';
function loadLB(){try{return JSON.parse(localStorage.getItem(LB_KEY)||'[]');}catch(e){return[];}}
function saveLB(entry){
  const lb=loadLB();lb.unshift(entry);
  if(lb.length>20)lb.length=20;
  localStorage.setItem(LB_KEY,JSON.stringify(lb));
  renderLB();
}
function renderLB(){
  const lb=loadLB();
  const table=$('lbtable'), empty=$('lbempty');
  if(!lb.length){table.style.display='none';empty.style.display='';return;}
  table.style.display='';empty.style.display='none';
  let rows='<tr><th>#</th><th>玩家</th><th>分数</th><th>时间</th></tr>';
  lb.forEach((e,i)=>{rows+=`<tr><td>${i+1}</td><td>${e.name}</td><td>${e.score}</td><td>${e.time}</td></tr>`;});
  table.innerHTML=rows;
}
renderLB();
function openLB(){
  renderLB();
  $('lboverlay').classList.add('show');
}
function closeLB(){
  $('lboverlay').classList.remove('show');
}
$('lboverlay').addEventListener('click',e=>{if(e.target===$('lboverlay'))closeLB();});
$('lbclose').addEventListener('click',closeLB);
$('btnlb').addEventListener('click',openLB);
$('btnlb').addEventListener('touchstart',e=>{e.preventDefault();openLB();},{passive:false});

function renderTopbar(){
  $('topbar').innerHTML=`<div class="top-l"><div class="bdg">${pxText('LV '+G.level,'px-level')}</div><div class="sc-row"><div class="sc-l">${pxText('SCORE','px-ui')}</div><div class="sc-v">${pxText(G.score,'px-score')}</div></div></div>
    <button id="pauseBtn" title="Pause"><span class="pbars"></span></button>`;
}
function cellHtml(r,c){
  const fl=G.flowers.find(f=>f.r===r&&f.c===c);
  // ★ 不再过滤 hp>0，hp=0 的怪兽也要渲染以便播放消散动画
  const mo=G.monsters.find(m=>m.col===c&&m.row===r);
  const isDef=r>=P_ROWS;
  let cls='cell';
  if(isDef)cls+=' def';
  if(mo)cls+=' hm';
  if(G.tbSel&&isDef)cls+=' tb-target';
  let inner='';
  if(fl)inner+=`<span class="fm">${fe(fl.v)}</span><span class="fv">${fl.v}</span>`;
  if(mo){
    const p=Math.max(0,Math.round(mo.hp/mo.mh*100));
    const dying=G.dying.includes(mo.id)?' dying':'';
    const dropLabel=mo.dv>0?`<span class="dr">${mo.de}${mo.dv}</span>`:'';
    inner+=`<div class="mo${dying}"><span class="mm">${mo.e}</span><span class="ht">${mo.hp}</span>
      <div class="hb"><div class="hf2" style="width:${p}%"></div></div>
      ${dropLabel}</div>`;
  }
  return `<div class="${cls}" data-r="${r}" data-c="${c}">${inner}</div>`;
}
function renderBoard(){
  let h=`<div class="sl">${pxText('MONSTER PATH','px-section')}</div><div class="brd">`;
  for(let r=0;r<P_ROWS;r++){
    h+=`<div class="brd-r"><div class="ri${r===P_ROWS-1?' d':''}">${r+1}</div>`;
    for(let c=0;c<COLS;c++)h+=cellHtml(r,c);
    h+=`</div>`;
  }
  const dangerRow=G.monsters.some(m=>m.row===P_ROWS-1);
  h+=`</div><div class="sep${dangerRow?' danger':''}"></div><div class="sl">${pxText('FLOWER FIELD','px-section')}</div><div class="brd">`;
  for(let r=P_ROWS;r<TOTAL_ROWS;r++){
    h+=`<div class="brd-r"><div class="ri">DF${r-P_ROWS+1}</div>`;
    for(let c=0;c<COLS;c++)h+=cellHtml(r,c);
    h+=`</div>`;
  }
  h+=`</div>`;
  // 用 opacity 微调替代瞬间替换
  const bd=$('boardbrd');
  bd.style.opacity='.85';
  $('board').innerHTML=h;
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{bd.style.opacity='1';});});
}
function renderToolbox(){
  const tbc=G.toolbox
    ?`<div class="tbs h${G.tbSel?' sel':''}" id="tbslot"><span class="fm">${G.toolbox.e}</span><span class="fv" style="color:#a855f7">${G.toolbox.v}</span></div>`
    :'<div class="tbs" id="tbslot"></div>';
  $('toolbox').innerHTML=`<div class="tbwrap">${tbc}<span class="tbl">${pxText('TOOLBOX','px-section')}</span></div>`;
}
function renderAll(){renderTopbar();renderBoard();renderToolbox();}
function renderPartial(){
  renderTopbar();
  renderBoard();
  renderToolbox();
}

// ============================================================
// 拖拽系统 — 支持棋盘花 + 工具箱花
// drag = { source:'board'|'toolbox', srcR?, srcC?, flower, targetR?, targetC?, targetAction? }
function startDrag(r,c,ev){
  ev.preventDefault();
  if(G.go)return;
  const fl=G.flowers.find(f=>f.r===r&&f.c===c);
  if(!fl)return;
  drag={source:'board',srcR:r,srcC:c,flower:fl,targetR:null,targetC:null,targetAction:null,moved:false};
  showGhost(fl,ev);
}
function startToolboxDrag(ev){
  ev.preventDefault();
  if(G.go||!G.toolbox)return;
  drag={source:'toolbox',srcR:null,srcC:null,flower:{r:-1,c:-1,v:G.toolbox.v},targetR:null,targetC:null,targetAction:null,moved:false};
  showGhost({v:G.toolbox.v},ev);
}
function showGhost(fl,ev){
  const g=$('ghost');
  g.style.display='flex';
  g.querySelector('.fm').textContent=fe(fl.v);
  g.querySelector('.fv').textContent=fl.v;
  const x=ev.clientX||(ev.touches&&ev.touches[0].clientX)||0;
  const y=ev.clientY||(ev.touches&&ev.touches[0].clientY)||0;
  g.style.left=(x-28)+'px';g.style.top=(y-28)+'px';
}

function moveGhost(ev){
  if(!drag)return;
  ev.preventDefault();
  drag.moved=true;
  const g=$('ghost');
  const x=ev.clientX||(ev.touches&&ev.touches[0].clientX)||0;
  const y=ev.clientY||(ev.touches&&ev.touches[0].clientY)||0;
  g.style.left=(x-28)+'px';g.style.top=(y-28)+'px';

  g.style.display='none';
  const el=document.elementFromPoint(x,y);
  g.style.display='flex';

  document.querySelectorAll('.drag-over,.drag-move,.drag-swap').forEach(e=>e.classList.remove('drag-over','drag-move','drag-swap'));
  drag.targetR=null;drag.targetC=null;drag.targetAction=null;

  if(el){
    const cell=el.closest('.cell.def');
    if(cell){
      const tr=+cell.dataset.r, tc=+cell.dataset.c;
      // For board source, skip self
      if(drag.source==='board' && tr===drag.srcR && tc===drag.srcC)return;
      const targetFl=G.flowers.find(f=>f.r===tr&&f.c===tc);
      if(targetFl && targetFl.v===drag.flower.v){
        // Same level → merge (yellow)
        cell.classList.add('drag-over');
        drag.targetR=tr;drag.targetC=tc;drag.targetAction='merge';
      }else if(targetFl && targetFl.v!==drag.flower.v){
        // Different level → swap (blue)
        cell.classList.add('drag-swap');
        drag.targetR=tr;drag.targetC=tc;drag.targetAction='swap';
      }else if(!targetFl){
        // Empty → move/place (green)
        cell.classList.add('drag-move');
        drag.targetR=tr;drag.targetC=tc;drag.targetAction=drag.source==='toolbox'?'place':'move';
      }
    }
  }
}

function endDrag(ev){
  if(!drag)return;
  ev.preventDefault();
  const g=$('ghost');
  g.style.display='none';g.style.left='-9999px';g.style.top='-9999px';
  document.querySelectorAll('.drag-over,.drag-move,.drag-swap').forEach(e=>e.classList.remove('drag-over','drag-move','drag-swap'));

  // Short click on toolbox without dragging → toggle selection mode
  if(!drag.moved && drag.source==='toolbox'){
    drag=null; tbClick(); return;
  }
  // Short click on board cell without dragging → just cancel
  if(!drag.moved){
    drag=null; return;
  }

  if(drag.targetR!=null&&drag.targetC!=null){
    const tr=drag.targetR, tc=drag.targetC;
    const target=G.flowers.find(f=>f.r===tr&&f.c===tc);

    if(drag.targetAction==='merge'){
      if(target&&target.v===drag.flower.v){
        if(drag.source==='toolbox'){
          mergeToolbox(target);
        }else{
          merge(drag.flower,target);
        }
        drag=null;return;
      }
    }else if(drag.targetAction==='swap'){
      if(target&&target.v!==drag.flower.v){
        if(drag.source==='toolbox'){
          const oldV=target.v;
          G.flowers=G.flowers.filter(f=>f!==target);
          G.flowers.push({r:tr,c:tc,v:G.toolbox.v});
          G.toolbox={e:fe(oldV),v:oldV};
        }else{
          const a=drag.flower,b=target;
          const ar=a.r,ac=a.c,av=a.v,br=b.r,bc=b.c,bv=b.v;
          G.flowers=G.flowers.filter(f=>f!==a&&f!==b);
          G.flowers.push({r:br,c:bc,v:av},{r:ar,c:ac,v:bv});
        }
        advanceTurn();drag=null;return;
      }
    }else if(drag.targetAction==='move'||drag.targetAction==='place'){
      if(!target){
        if(drag.source==='toolbox'){
          G.flowers.push({r:tr,c:tc,v:G.toolbox.v});
          G.toolbox=null;
        }else{
          drag.flower.r=tr;drag.flower.c=tc;
        }
        advanceTurn();drag=null;return;
      }
    }
  }
  drag=null;renderPartial();
}

function mergeToolbox(target){
  // Toolbox flower merged into existing board flower
  const nv=target.v*2;
  G.flowers=G.flowers.filter(f=>f!==target);
  G.flowers.push({r:target.r,c:target.c,v:nv});
  G.toolbox=null;
  advanceTurn();
}

// ============================================================
function merge(a,b){
  const nv=a.v*2;
  G.flowers=G.flowers.filter(f=>f!==a&&f!==b);
  G.flowers.push({r:b.r,c:b.c,v:nv});
  advanceTurn();
}

function tbClick(){
  if(G.go||!G.toolbox)return;
  // Toggle selection mode
  G.tbSel=!G.tbSel;
  renderToolbox();
  renderBoard(); // show/hide tb-target highlights
}
function tbPlaceAt(r,c){
  if(!G.toolbox||!G.tbSel)return;
  // replace any existing flower at this position
  G.flowers=G.flowers.filter(f=>!(f.r===r&&f.c===c));
  G.flowers.push({r,c,v:G.toolbox.v});
  G.toolbox=null;
  G.tbSel=false;
  advanceTurn();
}

// ============================================================
// 回合推进（坐标预采集→弹道→消散→清理→自动从顶部刷怪）
// ★ 穿透伤害：伤害从最前排依次穿透，溢出伤害打到下一只怪兽
function applyDamageNow(){
  const dyingSet=new Set();
  const colsWithFlowers=new Set(G.flowers.map(f=>f.c));
  for(const cn of colsWithFlowers){
    const colMons=G.monsters.filter(m=>m.col===cn&&m.hp>0);
    if(!colMons.length)continue;
    const totalDmg=G.flowers.filter(f=>f.c===cn).reduce((s,f)=>s+f.v,0);
    if(totalDmg<=0)continue;
    // 按 row 从大到小排序（最前排先挨打）
    colMons.sort((a,b)=>b.row-a.row);
    let remaining=totalDmg;
    for(const mon of colMons){
      if(remaining<=0)break;
      const dealt=Math.min(mon.hp, remaining);
      mon.hp-=dealt;
      remaining-=dealt;
      if(mon.hp<=0)dyingSet.add(mon.id);
    }
  }
  return dyingSet;
}
let advanceLock=false;
let pendingTurns=0; // 待处理的回合数，防止lock分支丢失伤害

function advanceTurn(){
  if(!G.monsters.length){
    // 没有怪兽时：消耗一个排队回合（无怪可打），然后刷怪渲染
    if(pendingTurns>0) pendingTurns--;
    spawnMonsters(); renderAll(); return;
  }
  if(advanceLock){
    // 动画未结束时又有操作：只渲染棋盘（花位已变），排队等动画结束后处理
    pendingTurns++;
    renderPartial();
    return;
  }
  advanceLock=true;

  // 1) ★ 先采集坐标（此时 HP 还没扣，monster 全部 hp>0）
  const atkData=collectAttackDataNow();

  // 2) ★ 每列只攻击最前排（row最大）的怪兽，打完才轮到下一个
  const dyingSet=applyDamageNow();

  // 3) 渲染棋盘（更新血条），清除旧 dying
  G.dying=[];
  renderPartial();

  // 4) 用预采坐标发射叶子
  if(atkData.length)launchLeaves(atkData);

  // 5) 弹道到达 → 消散动效
  const leafTime=atkData.length>0?480:0;
  setTimeout(()=>{
    if(!dyingSet.size)doCleanup();
    else{
      G.dying=[...dyingSet];
      renderPartial();
      setTimeout(()=>doCleanup(), 850);
    }
  }, leafTime);

  function doCleanup(){
    G.dying=[];
    const dead=G.monsters.filter(m=>m.hp<=0);
    G.killCount+=dead.length;
    // 积分 = 击败怪兽的血量直接累加；收集所有掉落，只取最高级
    let bestDrop=0;
    for(const m of dead){
      G.score+=m.mh;
      if(m.dv>bestDrop)bestDrop=m.dv;
    }
    if(bestDrop>0)G.toolbox={e:fe(bestDrop),v:bestDrop};
    G.monsters=G.monsters.filter(m=>m.hp>0);

    for(const m of G.monsters){
      m.row+=1;
      if(m.row>=P_ROWS){G.go=true;renderAll();endOverlay();advanceLock=false;return;}
    }

    if(!G.go){
      G.turnSinceSpawn++;
      const interval=1; // 统一每回合都尝试刷怪
      if(G.turnSinceSpawn>=interval||G.monsters.length===0){
        G.turnSinceSpawn=0;
        const oldLv=G.level;
        spawnMonsters();
        if(G.level>oldLv)showLvUp();
      }
    }

    G.prevLevel=G.level;
    renderAll();
    advanceLock=false;

    // 处理排队回合：每次cleanup后消耗一个pending，触发一轮新的攻击+动画
    if(pendingTurns>0){
      pendingTurns--;
      advanceTurn();
    }
  }
}

// ★ 每朵花发射一个叶片到最前排怪兽，弹道简洁不冗余
function collectAttackDataNow(){
  const data=[];
  const colsWithFlowers=new Set(G.flowers.map(f=>f.c));
  for(const cn of colsWithFlowers){
    const colMons=G.monsters.filter(m=>m.col===cn&&m.hp>0&&m.row>=0);
    if(!colMons.length)continue;
    colMons.sort((a,b)=>b.row-a.row); // 前排先挨打
    const frontMon=colMons[0];
    const monCell=document.querySelector(`.cell[data-r="${frontMon.row}"][data-c="${cn}"]`);
    if(!monCell)continue;
    const mRect=monCell.getBoundingClientRect();
    const mx=mRect.left+mRect.width/2, my=mRect.top+mRect.height/2;
    const flowersInCol=G.flowers.filter(f=>f.c===cn);
    flowersInCol.forEach(fl=>{
      const flCell=document.querySelector(`.cell[data-r="${fl.r}"][data-c="${fl.c}"]`);
      if(!flCell)return;
      const fRect=flCell.getBoundingClientRect();
      data.push({
        fx:fRect.left+fRect.width/2, fy:fRect.top+fRect.height/2,
        mx, my, v:fl.v
      });
    });
  }
  return data;
}

// ★ 用预取坐标直接发射叶子（无需等 rAF，保证弹道一定可见）
function launchLeaves(data){
  const ctr=$('proj');
  data.forEach((d,i)=>{
    setTimeout(()=>{
      const leaf=document.createElement('div');
      leaf.className='leaf';
      leaf.textContent='🍃';
      // 初始位置（花朵格中心）
      leaf.style.transition='none';
      leaf.style.left=(d.fx-14)+'px';
      leaf.style.top=(d.fy-14)+'px';
      leaf.style.fontSize='24px';
      leaf.style.opacity='1';
      ctr.appendChild(leaf);
      leaf.offsetHeight; // 强制重排，确保初始位置被记录
      // 飞行至怪兽位置
      leaf.style.transition='all .35s cubic-bezier(.2,.8,.3,1)';
      leaf.style.left=(d.mx-10)+'px';
      leaf.style.top=(d.my-10)+'px';
      leaf.style.fontSize='14px';
      leaf.style.opacity='.85';
      // 到达后显示伤害数字
      setTimeout(()=>{
        leaf.remove();
        const dmgEl=document.createElement('div');
        dmgEl.className='dmg-pop';
        dmgEl.textContent='-'+d.v;
        dmgEl.style.left=(d.mx-12)+'px';
        dmgEl.style.top=(d.my-18)+'px';
        ctr.appendChild(dmgEl);
        setTimeout(()=>dmgEl.remove(), 700);
      }, 380);
    }, i*50);
  });
}

// 事件
document.addEventListener('mousedown',e=>{
  // Start screen
  if(e.target.closest('#btnstart')){startGame();return;}
  // Pause overlay buttons
  if(e.target.closest('#pclose')||e.target.closest('#pcontinue')){resumeGame();return;}
  if(e.target.closest('#prestart')){resumeGame();restartGame();return;}
  if(e.target.closest('#phome')){resumeGame();backToHome();return;}
  // Pause button in game
  if(e.target.closest('#pauseBtn')){togglePause();return;}
  // Block actions when paused
  if(G.paused)return;
  // Toolbox drag start
  if((e.target.id==='tbslot'||e.target.closest('#tbslot'))&&G.toolbox&&!G.tbSel){startToolboxDrag(e);return;}
  // Toolbox selection mode: click defense cell to place
  if(G.tbSel){
    const cell=e.target.closest('.cell.def');
    if(cell){const r=+cell.dataset.r,c=+cell.dataset.c;tbPlaceAt(r,c);return;}
    // Click toolbox again → toggle off
    if(e.target.id==='tbslot'||e.target.closest('#tbslot')){tbClick();return;}
    // Click outside clears selection
    G.tbSel=false;renderToolbox();renderBoard();
    return;
  }
  const cell=e.target.closest('.cell.def');
  if(cell&&!G.go){const r=+cell.dataset.r,c=+cell.dataset.c;startDrag(r,c,e);}
  if(e.target.id==='tbslot'||e.target.closest('#tbslot'))tbClick();
  if(e.target.closest('#rst')){startGame();return;}
  if(e.target.closest('#btnhome')){backToHome();return;}
});
document.addEventListener('mousemove',e=>{if(drag)moveGhost(e);});
document.addEventListener('mouseup',e=>{if(drag)endDrag(e);});

document.addEventListener('touchstart',e=>{
  // Start screen
  if(e.target.closest('#btnstart')){startGame();return;}
  // Pause overlay buttons
  if(e.target.closest('#pclose')||e.target.closest('#pcontinue')){resumeGame();return;}
  if(e.target.closest('#prestart')){resumeGame();restartGame();return;}
  if(e.target.closest('#phome')){resumeGame();backToHome();return;}
  // Pause button in game
  if(e.target.closest('#pauseBtn')){togglePause();return;}
  // Block actions when paused
  if(G.paused)return;
  // Toolbox drag start
  if((e.target.id==='tbslot'||e.target.closest('#tbslot'))&&G.toolbox&&!G.tbSel){startToolboxDrag(e);return;}
  // Toolbox selection mode
  if(G.tbSel){
    const cell=e.target.closest('.cell.def');
    if(cell){const r=+cell.dataset.r,c=+cell.dataset.c;tbPlaceAt(r,c);return;}
    // Click toolbox again → toggle off
    if(e.target.id==='tbslot'||e.target.closest('#tbslot')){tbClick();return;}
    // Click outside clears selection
    G.tbSel=false;renderToolbox();renderBoard();
    return;
  }
  const cell=e.target.closest('.cell.def');
  if(cell&&!G.go){const r=+cell.dataset.r,c=+cell.dataset.c;startDrag(r,c,e);}
  if(e.target.id==='tbslot'||e.target.closest('#tbslot'))tbClick();
  if(e.target.closest('#rst')){startGame();return;}
  if(e.target.closest('#btnhome')){backToHome();return;}
},{passive:false});
document.addEventListener('touchmove',e=>{if(drag)moveGhost(e);},{passive:false});
document.addEventListener('touchend',e=>{if(drag)endDrag(e);},{passive:false});

// ============================================================
// Start game
function togglePause(){
  if(G.go)return;
  G.paused=!G.paused;
  if(G.paused){
    $('pauseover').classList.add('show');
  }else{
    $('pauseover').classList.remove('show');
  }
}
function resumeGame(){
  G.paused=false;
  $('pauseover').classList.remove('show');
}
function backToHome(){
  $('gover').classList.remove('show');
  $('startscreen').style.display='';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $('startscreen').classList.remove('hide');
    startDemo();
  }));
}
function startGame(){
  stopDemo();
  $('startscreen').classList.add('hide');
  $('gover').classList.remove('show');
  setTimeout(()=>{$('startscreen').style.display='none';},400);
  init();
}
function restartGame(){
  G.paused=false;
  $('gover').classList.remove('show');
  $('pauseover').classList.remove('show');
  init();
}

// ===== Start screen attract-mode demo =====
let demoTimer=null;
function stopDemo(){
  if(demoTimer){clearTimeout(demoTimer);demoTimer=null;}
  const stage=$('demostage');
  if(stage) stage.querySelectorAll('.demo-entity').forEach(el=>el.remove());
}
function startDemo(){
  stopDemo();
  const stage=$('demostage');
  if(!stage) return;
  const leftPad=12, cellW=42, gap=4;
  const leftCol=leftPad+1*(cellW+gap);     // 左侧郁金香
  const rightCol=leftPad+3*(cellW+gap);    // 右侧郁金香（目标位置）
  const rTop=12, rBot=66;

  // 左侧🌷（被拖动）
  const leftFlower=document.createElement('div');
  leftFlower.className='demo-entity';
  leftFlower.textContent='🌷';
  leftFlower.style.left=leftCol+'px';
  leftFlower.style.top=rBot+'px';
  leftFlower.style.opacity='0';
  stage.appendChild(leftFlower);

  // 右侧🌷（被合并的目标）
  const rightFlower=document.createElement('div');
  rightFlower.className='demo-entity';
  rightFlower.textContent='🌷';
  rightFlower.style.left=rightCol+'px';
  rightFlower.style.top=rBot+'px';
  rightFlower.style.opacity='0';
  stage.appendChild(rightFlower);

  const monster=document.createElement('div');
  monster.className='demo-entity demo-monster';
  monster.textContent='👾';
  monster.style.left=rightCol+'px';
  monster.style.top=rTop+'px';
  monster.style.opacity='0';
  stage.appendChild(monster);

  const leaf=document.createElement('div');
  leaf.className='demo-entity demo-leaf';
  leaf.textContent='🍃';
  leaf.style.left=rightCol+'px';
  leaf.style.top=rBot+'px';
  leaf.style.opacity='0';
  stage.appendChild(leaf);

  // 假鼠标指针，尖端对准花朵中心
  const cursor=document.createElement('div');
  cursor.className='demo-cursor';
  cursor.innerHTML='<svg viewBox="0 0 24 24"><path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 0 1 .35-.15h6.87a.5.5 0 0 0 .35-.85L6.35 2.86a.5.5 0 0 0-.85.35z" fill="#fff" stroke="#222" stroke-width="1.2"/></svg>';
  stage.appendChild(cursor);

  function set(ent,x,y,op){ ent.style.left=x+'px'; ent.style.top=y+'px'; ent.style.opacity=op; }
  function cx(col){return col+21-5;}  // 鼠标尖端对准花朵中心（微调）
  function cy(){return rBot+19-2;}

  function loop(){
    // Step 0: reset — disable transitions to avoid visible snap/fly-in from previous positions
    cursor.style.transition='none';
    leftFlower.style.transition='none';
    set(leftFlower,leftCol,rBot,'0');
    set(rightFlower,rightCol,rBot,'0');
    set(monster,rightCol,rTop,'0');
    set(leaf,rightCol,rBot,'0');
    set(cursor,cx(leftCol),cy(),'0');
    void cursor.offsetHeight; // force reflow
    cursor.style.transition='all .3s cubic-bezier(.2,.8,.3,1)';
    leftFlower.style.transition='left .5s cubic-bezier(.2,.8,.3,1), opacity .3s';
    rightFlower.textContent='🌷';
    rightFlower.classList.remove('demo-pulse');
    monster.classList.remove('demo-fade');
    monster.classList.remove('demo-pop');

    let t=30;
    // 1) 显示左右两朵郁金香，鼠标落在左侧🌷上
    demoTimer=setTimeout(()=>{
      set(leftFlower,leftCol,rBot,'1');
      set(rightFlower,rightCol,rBot,'1');
      set(cursor,cx(leftCol),cy(),'1');
    },t); t+=500;

    // 2) 鼠标把左侧🌷从左拖到右，与右侧🌷重叠
    demoTimer=setTimeout(()=>{
      set(cursor,cx(rightCol),cy(),'1');
      set(leftFlower,rightCol,rBot,'1');
      demoTimer=setTimeout(()=>{
        // 重叠后合并成玫瑰
        leftFlower.style.opacity='0';
        rightFlower.classList.add('demo-pulse');
        rightFlower.textContent='🌹';
        // 鼠标移开淡出
        set(cursor,cx(rightCol)+40,cy()+40,'0');
      },300);
    },t); t+=650;

    // 3) 怪兽出现
    demoTimer=setTimeout(()=>{
      monster.classList.add('demo-pop');
      set(monster,rightCol,rTop,'1');
    },t); t+=600;

    // 4) 玫瑰发射叶片，叶片碰到怪兽后怪兽才消散
    demoTimer=setTimeout(()=>{
      set(leaf,rightCol,rBot,'1');
      demoTimer=setTimeout(()=>{
        // 叶片飞到怪兽位置
        set(leaf,rightCol,rTop,'0');
        demoTimer=setTimeout(()=>{
          // 叶片撞到怪兽后才开始消散
          monster.classList.remove('demo-pop');
          monster.classList.add('demo-fade');
          demoTimer=setTimeout(()=>{
            set(monster,rightCol,rTop,'0');
            demoTimer=setTimeout(loop,600);
          },400);
        },400);
      },450);
    },t);
  }

  loop();
}

function endOverlay(){
  if(getComputedStyle($('startscreen')).display==='none'){
    $('gover').classList.add('show');
    const hi=saveHighest(G.score);
    $('goScore').innerHTML=pxText('SCORE: '+G.score,'px-game-score');
    $('goWave').innerHTML=pxText('LV '+G.level,'px-game-sub')+pxText('HIGHEST: '+hi,'px-game-sub');
    // Save to leaderboard
    const pid=getPlayerId();
    const now=new Date();
    const t=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    saveLB({name:pid,score:G.score,time:t});
  }
}
const HI_KEY='flower_td_hi';
function getHighest(){return Math.max(0,parseInt(localStorage.getItem(HI_KEY)||'0',10)||0);}
function saveHighest(score){
  const cur=getHighest();
  if(score>cur)localStorage.setItem(HI_KEY,String(score));
  return Math.max(score,cur);
}
function getPlayerId(){
  let pid=localStorage.getItem('flower_td_pid');
  if(!pid){pid='P'+String(Math.floor(Math.random()*9000)+1000);localStorage.setItem('flower_td_pid',pid);}
  return pid;
}

let tid;
function toast(msg){
  const el=$('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(tid);tid=setTimeout(()=>el.classList.remove('show'),700);
}

startDemo();
